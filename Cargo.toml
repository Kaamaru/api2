[package]
name = "api2"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.1"
chrono = { version = "0.4.41", features = ["serde"] }
chrono-tz = "0.10.3"
imgbb = "1.4.0"
lettre = { version = "0.11.17", features = ["builder", "smtp-transport"] }
magic-crypt = "4.0.1"
reqwest = { version = "0.12.20", features = ["json", "blocking", "multipart"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
shuttle-axum = "0.55.0"
shuttle-runtime = "0.55.0"
tokio = { version = "1.28.2", features = ["full"] }
