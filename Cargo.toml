[package]
name = "api2"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.1", features = ["macros"] }
chrono = { version = "0.4.41", features = ["serde"] }
chrono-tz = "0.10.3"
dotenv = "0.15.0"
firestore = "0.47.0"
futures = "0.3.31"
imgbb = "1.4.0"
lettre = { version = "0.11.17", features = ["builder", "smtp-transport"] }
magic-crypt = "4.0.1"
reqwest = { version = "0.12.20", features = ["json", "blocking", "multipart"] }
rustls = { version = "0.23.35", features = ["ring"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tensorflow = "0.21.0"
tokio = { version = "1.28.2", features = ["full"] }
tower-http = { version = "0.6.6", features = ["cors"] }
uuid = { version = "1.17.0", features = ["v4"] }
